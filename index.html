<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toyoparts</title>
    <meta name="author" content="Toyoparts" />
    <meta name="theme-color" content="#eb0a1e" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx" data-cfasync="false"></script>
    <script id="toyoparts-deferred-gtm" data-cfasync="false">
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
      (function loadGtmWhenCalm() {
        var loaded = false;
        function load() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.setAttribute('data-cfasync', 'false');
          s.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-5B9VBQ';
          document.head.appendChild(s);
        }
        ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function (name) {
          window.addEventListener(name, load, { once: true, passive: true });
        });
        if ('requestIdleCallback' in window) requestIdleCallback(load, { timeout: 3500 });
        else setTimeout(load, 3500);
      })();
    </script>
  </body>
</html>
